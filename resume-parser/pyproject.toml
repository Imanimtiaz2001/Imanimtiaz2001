[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clearcv"
version = "1.0.0"
description = "Evidence-grounded resume PDF extraction and review"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "python-multipart>=0.0.20,<1",
  "pydantic>=2.10,<3", "pydantic-settings>=2.8,<3", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "pdfplumber>=0.11,<1", "pypdfium2>=4.30,<6",
  "Pillow>=11,<13", "httpx[socks]>=0.28,<1", "prometheus-client>=0.21,<1",
  "reportlab>=4.3,<5"
]
[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "hypothesis>=6.120,<7", "ruff>=0.11,<1", "respx>=0.22,<1"]
[tool.hatch.build.targets.wheel]
packages = ["src/clearcv"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
