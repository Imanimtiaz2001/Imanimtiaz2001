[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wayfinder-ai-travel-planner"
version = "1.0.0"
description = "Evidence-aware multi-agent travel planning with budget verification"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.8,<3",
  "httpx>=0.27,<1", "langgraph>=0.3,<2", "sqlalchemy>=2,<3",
  "psycopg[binary]>=3.2,<4", "openai>=1.90,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
