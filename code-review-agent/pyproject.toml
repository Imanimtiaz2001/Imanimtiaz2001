[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reviewline-agent"
version = "0.1.0"
description = "Evidence-checked, line-referenced Python code review agent"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Iman Imtiaz"}]
keywords = ["code-review", "static-analysis", "ai", "security", "sarif"]

[project.scripts]
reviewline = "reviewline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

