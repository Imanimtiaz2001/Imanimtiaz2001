services:
  api:
    environment:
      PROVIDER: local
      OLLAMA_URL: http://ollama:11434
      TURN_TIMEOUT: ${TURN_TIMEOUT:-300}
      PROVIDER_TIMEOUT: ${PROVIDER_TIMEOUT:-120}
    depends_on:
      ollama-init: {condition: service_completed_successfully}
      whisper-init: {condition: service_completed_successfully}
  ollama:
    image: ollama/ollama:0.11.10
    volumes: ["ollama-data:/root/.ollama"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    mem_limit: 5g
  ollama-init:
    image: ollama/ollama:0.11.10
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull $${LOCAL_CHAT_MODEL} && ollama pull $${LOCAL_EMBEDDING_MODEL}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
      LOCAL_CHAT_MODEL: ${LOCAL_CHAT_MODEL:-qwen2.5:3b}
      LOCAL_EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL:-nomic-embed-text}
    depends_on:
      ollama: {condition: service_healthy}
  whisper-init:
    image: voxdesk:local
    build: .
    entrypoint: ["/app/.venv/bin/python", "-c"]
    command: ["import os; from faster_whisper import WhisperModel; WhisperModel(os.environ.get('WHISPER_MODEL','base'),device='cpu',compute_type='int8'); print('Whisper ready')"]
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
    volumes: ["speech-cache:/home/voxdesk/.cache"]
volumes:
  ollama-data:
