name: Code Review Agent CI
on:
  push:
    paths: ['code-review-agent/**', '.github/workflows/code-review-agent-ci.yml']
  pull_request:
    paths: ['code-review-agent/**', '.github/workflows/code-review-agent-ci.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e code-review-agent
      - run: python -m unittest discover -s code-review-agent/tests -v

