name: Wayfinder CI
on:
  push:
    paths: ["ai-travel-planner/**", ".github/workflows/wayfinder-ci.yml"]
  pull_request:
    paths: ["ai-travel-planner/**", ".github/workflows/wayfinder-ci.yml"]
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-travel-planner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]' pytest-asyncio
      - run: ruff check app tests
      - run: pytest -q
      - run: node --check app/static/app.js
