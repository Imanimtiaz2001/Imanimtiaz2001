name: Code Review Agent PR
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths: ['code-review-agent/**/*.py']
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      # Use trusted base-branch code and treat PR source as data.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e code-review-agent
      - name: Post inline review comments
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REVIEWLINE_PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEWLINE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python -m reviewline.action
